[project]
name = "andexor-grass-spider-soa-service"
version = "1.0.0"
description = "Audits the SOA DNS record for a domain"
readme = "README.md"
authors = [
    { name = "Ed Jenkins", email = "ed@andexor.net" }
]
requires-python = ">=3.14"
dependencies = [
    "dnspython[idna]>=2.8.0",
    "pip-licenses>=5.5.5",
]
license = 'Apache-2.0'
license-files = ['LICENSE']
keywords = ["Andexor", "Grass Spider", "SEO", "DNS", "SOA"]

[project.scripts]
andexor-grass-spider-soa-service = "andexor_grass_spider_soa_service:main"

[project.urls]
homepage = "https://andexor.net"
documentation = "https://andexor.net"
source = "https://github.com/andexor/andexor-grass-spider-soa-service"
issues = "https://github.com/andexor/andexor-grass-spider-soa-service/issues"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "1 week"
